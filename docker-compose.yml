x-php-build: &php-build
  context: ./docker/php
  args:
    UID: 1000
    GID: 1000

services:
  app:
    build: *php-build
    image: scanner_app
    container_name: scanner_app
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      - db

  web:
    image: nginx:alpine
    container_name: scanner_web
    ports:
      - "8005:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: scanner_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: scanner
      MYSQL_ROOT_PASSWORD: laravel
    ports:
      - "3310:3306"
    volumes:
      - dbdata:/var/lib/mysql

  node:
    build: *php-build
    image: scanner_app
    container_name: scanner_node
    working_dir: /var/www
    volumes:
      - ./:/var/www
    ports:
      - "5173:5173"
    depends_on:
      - app
    command: sh -c "npm install && npm run dev"

volumes:
  dbdata: